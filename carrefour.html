<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0878D1">
  <title>Carrefour - Quickly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="carrefour.css">
</head>
<body>

  <!-- ===== En-tête ===== -->
  <header class="topbar">
    <a class="icon-btn" id="backBtn" href="groceries.html" aria-label="Retour aux supermarchés">
      <i data-lucide="arrow-left"></i>
    </a>

    <a class="brand" href="index.html" aria-label="Accueil Quickly">
      <img src="Quickly.png" alt="Quickly" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-text',textContent:'Quickly'}))">
    </a>

    <form class="search" id="searchForm" role="search">
      <i data-lucide="search"></i>
      <input id="searchInput" type="search" placeholder="Rechercher un produit dans Carrefour…"
             autocomplete="off" enterkeyhint="search" aria-label="Rechercher un produit">
      <button type="button" class="clear" id="clearSearch" aria-label="Effacer la recherche" hidden>
        <i data-lucide="x"></i>
      </button>
    </form>

    <a class="cart-btn" href="cart.html" aria-label="Panier">
      <i data-lucide="shopping-cart"></i>
      <span class="cart-badge" id="cartBadge" hidden>0</span>
      <span class="cart-label">Panier</span>
    </a>
  </header>

  <main class="page">

    <!-- ===== Bannière du magasin ===== -->
    <section class="banner" id="banner" aria-label="Magasin">
      <div class="banner-logo"><img id="bannerLogo" alt="" hidden><span id="bannerInitial"></span></div>
      <div class="banner-info">
        <h1 id="storeName">Carrefour</h1>
        <p id="storeTagline">Vos courses livrées chez vous</p>
        <ul class="chips" id="storeChips"></ul>
      </div>
    </section>

    <!-- ===== Catégories : barre latérale (PC) / défilement horizontal (mobile) ===== -->
    <nav class="cats" id="cats" aria-label="Catégories"></nav>

    <!-- ===== Produits ===== -->
    <section class="content">
      <div class="toolbar">
        <p class="result-info" id="resultInfo" aria-live="polite"></p>
        <label class="sort">
          <span>Trier</span>
          <select id="sortSelect">
            <option value="default">Pertinence</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="name">Nom (A–Z)</option>
          </select>
        </label>
      </div>

      <div class="notice" id="notice" hidden></div>

      <div class="grid" id="grid" aria-live="polite"></div>

      <div class="more" id="moreBox" hidden>
        <button type="button" class="btn-outline" id="loadMore">Charger plus de produits</button>
      </div>
    </section>

  </main>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script type="module" src="carrefour.js"></script>
</body>
</html>
